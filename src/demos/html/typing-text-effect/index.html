<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Text Effect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="typing-container">
      <!-- Screen readers get the sentence once. The animation is hidden from
           them: as a live region it would be read out on every keystroke. -->
      <p>
        <span class="visually-hidden">
          I love basketball, tennis and volleyball.
        </span>
        <span aria-hidden="true">
          I LOVE
          <span class="typing-text"></span>
        </span>
      </p>
    </section>
    <script src="script.js" defer></script>
  </body>
</html>
