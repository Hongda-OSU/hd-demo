<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Loop Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body>
<section>
  <h1>Vertical image loop with scroll acceleration with gsap</h1>
</section>

<div class="gallery">

  <div class="col">
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/lighthouse.jpg" alt="Red and white lighthouse on a cliff at sunset">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/sunflowers.jpg" alt="Sunflower field under a blue summer sky">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/maple-path.jpg" alt="Stone steps through a red maple forest">
    </div>
  </div>
  
 <div class="col">
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/lagoon.jpg" alt="Wooden boat in a turquoise cove">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/aurora.jpg" alt="Northern lights over a snowy pine forest">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/coral-reef.jpg" alt="Tropical fish over a colorful coral reef">
    </div>
  </div>
  
  <div class="col">
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/cherry-bridge.jpg" alt="Cherry blossom tree by an old stone bridge">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/lavender.jpg" alt="Lavender rows leading to a stone farmhouse">
    </div>
    <div class="image">
      <img src="https://hongdalin.blog/hd-demo/demos/html/vertical-loop-gallery/images/balloons.jpg" alt="Hot air balloons over a canyon at sunrise">
    </div>
  </div>
</div>
    <script src="script.js"></script>
  </body>
</html>
