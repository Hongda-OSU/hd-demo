<div class="fade"></div>

<section class="space-crawl">
  <div class="crawl">
    <div class="title">
      <p>第七纪元</p>
      <h1>远航之光</h1>
    </div>
    <p>星际航道已经沉寂了三百年。边缘星域的最后一座灯塔熄灭之后，商船在黑暗中迷失方向，殖民地之间的联系一个接一个地中断。</p>
    <p>年轻的领航员林舟在一艘废弃货船的残骸里，找到了一张古老的星图。图上标着一条早已被遗忘的航线，尽头是传说中点亮第一座灯塔的地方。</p>
    <p>她带着星图和一船志愿者，驶入了没有任何信号的深空。在她们身后，熄灭的灯塔正一座接一座地重新亮起……</p>
  </div>
</section>
