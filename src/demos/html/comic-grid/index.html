<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comic Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
<div class="parent">
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/station-dawn.jpg"
      alt="A wooden country station at dawn"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/rice-fields.jpg"
      alt="A small red train curving through rice fields"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/tunnel.jpg"
      alt="The train coming out of an ivy-covered tunnel"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/bridge.jpg"
      alt="The train crossing an iron bridge over a gorge"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/mountain-lake.jpg"
      alt="The train along a mountain lake at golden hour"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/maple-forest.jpg"
      alt="Tracks running into a red and gold maple forest"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/snowy-pass.jpg"
      alt="The train on a snowy mountain pass"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/seaside-village.jpg"
      alt="A seaside village at sunset"
    />
  </div>
  <div class="child">
    <img
      src="https://hongdalin.blog/hd-demo/demos/html/comic-grid/images/night-platform.jpg"
      alt="A lit platform under a starry night sky"
    />
  </div>
</div>
  </body>
</html>
