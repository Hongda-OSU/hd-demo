<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
<canvas id="sketch" aria-hidden="true"></canvas>
<div class="gallery-container">
  <header class="gallery-header">
    <h1>By the Water</h1>
    <p>Six scenes that ripple like the water in them.</p>
  </header>
  <ul class="gallery">
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/harbor.jpg" class="gallery-item-img" alt="Fishing boats moored in a calm harbor at dawn, a lighthouse on the breakwater" />
      <div class="gallery-item-text">Harbor at Dawn</div>
    </li>
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/lake.jpg" class="gallery-item-img" alt="Snowy peaks and pine forest mirrored in a still mountain lake beside a wooden pier" />
      <div class="gallery-item-text">Mountain Lake</div>
    </li>
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/beach.jpg" class="gallery-item-img" alt="Waves rolling onto a palm-lined beach under an orange sunset" />
      <div class="gallery-item-text">Sunset Beach</div>
    </li>
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/canal.jpg" class="gallery-item-img" alt="Lanterns reflected in a canal on a rainy evening, beside a stone bridge" />
      <div class="gallery-item-text">Rainy Canal</div>
    </li>
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/waterfall.jpg" class="gallery-item-img" alt="A waterfall pouring into a misty green gorge with a rainbow in the spray" />
      <div class="gallery-item-text">Rainbow Falls</div>
    </li>
    <li class="gallery-item">
      <img src="https://hongdalin.blog/hd-demo/demos/html/wave-gallery/images/aurora.jpg" class="gallery-item-img" alt="Green and violet aurora over a frozen bay full of ice floes at night" />
      <div class="gallery-item-text">Aurora Bay</div>
    </li>
  </ul>
</div>
    <script type="module" src="script.js"></script>
  </body>
</html>
